[[hooks]]
name = "github-secret-scan"
type = "before_tool"
match = "github:*"
strict = true
command = "if git diff | grep -q -E '(API_KEY|SECRET|TOKEN|PASSWORD|PRIVATE_KEY)' || git diff --cached | grep -q -E '(API_KEY|SECRET|TOKEN|PASSWORD|PRIVATE_KEY)' || git diff HEAD | grep -q -E '(API_KEY|SECRET|TOKEN|PASSWORD|PRIVATE_KEY)'; then echo 'ERROR: Secrets detected in changes or staged files!'; exit 1; fi"
timeout = 30.0
description = "Block GitHub operations if secrets detected in workspace, staged files, or last commit"

[[hooks]]
name = "block-main-push"
type = "before_tool"
match = "git:push"
strict = true
command = "if git symbolic-ref --short HEAD | grep -q '^main$\|^master$'; then echo 'ERROR: Direct pushes to main/master are not allowed. Use feature branches and PRs.'; exit 1; fi"
timeout = 10.0
description = "Prevent direct pushes to main/master branches"

[[hooks]]
name = "check-env-files"
type = "before_commit"
strict = true
command = "if git diff --cached | grep -q -E '\.env($|\.|\.example$|\.local$)'; then echo 'ERROR: Environment files should not be committed!'; exit 1; fi"
timeout = 10.0
description = "Block commits containing .env files"
